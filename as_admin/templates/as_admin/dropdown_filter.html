<h3>By {{ title }}</h3>
<ul style="max-width: 200px;">
  <li style="width: 100%;">
    <select onchange="window.location.search = this.value;" style="width: 100%;">
      {% for choice in choices %}
        <option value="{{ choice.query_string }}" {% if choice.selected %}selected{% endif %}>
          {{ choice.display }}
        </option>
      {% endfor %}
    </select>
  </li>
</ul>
